title: "MISSION CONTROL // ECHO"
workspace_root: "/Users/ravery/Documents/MISSION_CONTROL"
refresh_hz: 4.0

weather:
  enabled: true
  city: "Detroit"
  latitude: 42.3314
  longitude: -83.0458
  units: "fahrenheit"

missions:
  - id: "legacy-core"
    name: "Legacy Mission Core"
    target_dir: "/Users/ravery/Documents/MISSION_CONTROL/mission_control_app"
    file_ext: ".py"
    total_delta: 3
    color: "cyan"
    note: "Older terminal dashboard wired into the new pipeline"
    exclude_dirs: ["venv", ".venv", "__pycache__", ".git"]
  - id: "archive-v1"
    name: "V1 Archive"
    target_dir: "/Users/ravery/Documents/MISSION_CONTROL/V1"
    file_ext: ".py"
    total_delta: 2
    color: "magenta"
    note: "Original mission control reference build"
    exclude_dirs: ["venv", ".venv", "__pycache__", ".git"]
  - id: "new-control-room"
    name: "New Control Room"
    target_dir: "/Users/ravery/Documents/MISSION_CONTROL/mission_control_pro"
    file_ext: ".py"
    total_delta: 5
    color: "green"
    note: "The rebuilt dashboard itself"
    exclude_dirs: ["venv", ".venv", "__pycache__", ".git"]

services:
  - name: "Mission Control"
    kind: "process"
    match: "mission_control.py"
    note: "Terminal dashboard runtime"
  - name: "VS Code"
    kind: "process"
    match: "Code"
    note: "Editor session"
  - name: "Python Runner"
    kind: "process"
    match: "python"
    note: "Any active python pipeline workers"
  - name: "Local Port 3000"
    kind: "port"
    host: "127.0.0.1"
    port: 3000
    note: "Preview or local web app"

endpoints:
  - name: "Local Health"
    url: "http://127.0.0.1:3000/health"
    note: "Healthcheck for the local preview app"
  - name: "Mission API"
    url: "http://127.0.0.1:8000/health"
    note: "Placeholder for your local pipeline API"

animations:
  sources:
    - name: "fireworks"
      url: "https://www.asciiart.eu/animations/ascii-fireworks"
    - name: "horizon"
      url: "https://www.asciiart.eu/animations/ascii-horizon"
    - name: "radio"
      url: "https://www.asciiart.eu/animations/ascii-radio-waves"
    - name: "rain"
      url: "https://www.asciiart.eu/animations/ascii-rain-drops"
    - name: "starfield"
      url: "https://www.asciiart.eu/animations/ascii-starfield"
    - name: "galaxy"
      url: "https://www.asciiart.eu/animations/ascii-rotating-galaxy"
    - name: "tunnel"
      url: "https://www.asciiart.eu/animations/ascii-tunnel"
    - name: "plasma"
      url: "https://www.asciiart.eu/animations/ascii-plasma"
    - name: "hey-duggee"
      url: "https://ascii.co.uk/animated-art/artist-animated-ascii-art-by-hey-duggee.html"
    - name: "ascii-motion-squirrel"
      url: "https://ascii-motion.app/community/project/5097d8dd-9b38-4786-b7dd-dcb18754584d"

shortcuts:
  - label: "Open Workspace"
    command: "code /Users/ravery/Documents/MISSION_CONTROL"
    note: "Launch this folder in VS Code"
    match: "Code"
    mode: "persistent"
  - label: "Run Mission Control"
    command: "cd /Users/ravery/Documents/MISSION_CONTROL/mission_control_pro && ./start.sh --embedded"
    note: "Start the terminal dashboard in-place"
    match: "mission_control_tui.py"
    mode: "persistent"
  - label: "Edit Pipeline"
    command: "code /Users/ravery/Documents/MISSION_CONTROL/mission_control_pro/dashboard.yaml"
    note: "Tweak widgets and mission targets"
    match: "Code"
    mode: "persistent"
  - label: "Tail Missions"
    command: "cat /Users/ravery/Documents/MISSION_CONTROL/mission_control_pro/active_missions.json"
    note: "Inspect the live pipeline seed"
    mode: "one-shot"
